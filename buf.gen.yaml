# Code generation for plugin/proto. Both plugins run as local `go run`
# commands pinned to exact versions, so `make proto` needs nothing from the
# Buf Schema Registry: buf itself is also pinned (see the Makefile).
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: plugin/proto
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: plugin/proto
    opt: paths=source_relative
