name: 🐛 Bug report
description: Report a defect in tobira CLI, a driver, or the core
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please do NOT paste real credentials or connection strings.
  - type: input
    id: version
    attributes:
      label: tobira version
      description: Output of `tobira version`.
      placeholder: "tobira 0.1.0 (commit abc1234)"
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go version go1.26.0 darwin/arm64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli / TUI
        - a database driver
        - driver contract / drivertest
        - docs / examples
    validations:
      required: true
  - type: input
    id: scheme
    attributes:
      label: Database / driver (if applicable)
      placeholder: "sqlite, postgres, mysql, mongodb, redis"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands run or steps taken. Redact credentials and connection strings.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Relevant output. Confirm no credentials are included.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have removed all real credentials from this report.
          required: true
