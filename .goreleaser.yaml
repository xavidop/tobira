# GoReleaser configuration for tobira.
#
# The root module is a library consumed via `go get` at the git tag. GoReleaser
# builds and releases the one shipped binary, the tobira CLI (cmd/tobira, its
# own module), with checksums, SBOMs, a changelog, a Homebrew cask, a Scoop
# manifest and deb, rpm and apk packages.
version: 2

project_name: tobira

before:
  hooks:
    # The shell completions go into the archives and the Linux packages.
    - ./scripts/completions.sh

builds:
  - id: tobira
    dir: cmd/tobira
    main: .
    binary: tobira
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # minicore_disabled drops gosnowflake's embedded native "minicore"
    # libraries (one per platform): the release is CGO_ENABLED=0 and could
    # never load them, and the snowflake driver turns minicore off anyway.
    flags:
      - -tags=minicore_disabled
    ldflags:
      - -s -w
      - -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: tobira
    ids: [tobira]
    name_template: "tobira_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - completions/*

# Linux packages, attached to the GitHub Release next to the archives. They
# install the binary and the shell completions; no package repository is
# published, so a user downloads the file for their distribution.
nfpms:
  - id: tobira
    ids: [tobira]
    package_name: tobira
    file_name_template: "tobira_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Xavier Portilla Edo
    maintainer: Xavier Portilla Edo <xavi_tb@hotmail.com>
    homepage: "https://xavidop.github.io/tobira/"
    description: Every database, one terminal.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./completions/tobira.bash
        dst: /usr/share/bash-completion/completions/tobira
        file_info:
          mode: 0644
      - src: ./completions/tobira.fish
        dst: /usr/share/fish/vendor_completions.d/tobira.fish
        file_info:
          mode: 0644
      - src: ./completions/tobira.zsh
        dst: /usr/share/zsh/vendor-completions/_tobira
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/tobira/copyright
        file_info:
          mode: 0644
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Drivers
      regexp: '^.*?(feat|fix)\((sqlite|postgres|mysql|mongodb|redis|drivertest)\).+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: xavidop
    name: tobira
  draft: false
  prerelease: auto
  name_template: "tobira {{ .Tag }}"
  footer: |
    ---
    **Install:** `brew install xavidop/tap/tobira` (macOS), `scoop install tobira` (Windows, after
    `scoop bucket add xavidop https://github.com/xavidop/scoop-bucket`), or the `.deb`, `.rpm` or
    `.apk` package below (Linux).

    **Docs:** https://xavidop.github.io/tobira/

# The Scoop manifest is committed to xavidop/scoop-bucket, which needs a token
# that can write there (see release.yml). Scoop reads the Windows zip archives.
scoops:
  - name: tobira
    ids: [tobira]
    repository:
      owner: xavidop
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://xavidop.github.io/tobira/"
    description: "Every database, one terminal"
    license: MIT

# The tap lives in a different repository, so this block needs its own token
# (see release.yml, which falls back to GITHUB_TOKEN when the secret is absent).
# GoReleaser deprecated `brews` (formulas) for casks, which have no `test`
# block: release.yml smoke-tests the built binary with `tobira version` instead.
# The binary is unsigned, so the post-install hook clears the macOS quarantine
# attribute. Casks install on macOS only; Linux users take the release archive.
homebrew_casks:
  - name: tobira
    ids: [tobira]
    binaries: [tobira]
    directory: Casks
    repository:
      owner: xavidop
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://xavidop.github.io/tobira/"
    # Homebrew rejects a description that ends with a period.
    description: "Every database, one terminal"
    # Removes the macOS quarantine attribute so the unsigned binary runs.
    # Homebrew deprecated the Ruby postflight block that hooks.post.install
    # writes; its replacement, postflight_steps, is declarative and cannot
    # read staged_path, so the path is the {{staged_path}} token instead.
    # GoReleaser 2.18 has no install_steps option yet (2.19 adds
    # hooks.post.install_steps), so the block goes in custom_block, which
    # renders at the top of the cask. The whole cask is run through
    # GoReleaser's templates, hence {{ "{{" }} to emit Homebrew's braces.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:           ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path}}/tobira"],
              writable_paths: ["tobira"],
              writable_base:  :staged_path
        end
      end
